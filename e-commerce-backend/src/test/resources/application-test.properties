# Not a credential: this key signs tokens only inside this test suite.
app.jwt.secret=insecure-test-only-signing-key-0123456789
app.jwt.access-token-ttl=15m
app.jwt.refresh-token-ttl=30d

# Off by default so in-memory buckets cannot leak across tests. RateLimitIT turns it on.
app.rate-limit.enabled=false
app.rate-limit.capacity=3
app.rate-limit.refill-period=1m
