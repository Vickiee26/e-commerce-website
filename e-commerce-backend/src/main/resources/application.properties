spring.application.name=e-commerce-backend
spring.profiles.default=dev

# Flyway owns the schema; Hibernate only checks that entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Lazy loading must fail loudly in a service rather than silently work in a view.
spring.jpa.open-in-view=false

app.jwt.issuer=shopflow
app.jwt.access-token-ttl=15m
app.jwt.refresh-token-ttl=30d

app.rate-limit.enabled=true
app.rate-limit.capacity=5
app.rate-limit.refill-period=1m

# Optional first-admin bootstrap. Empty by default, so nothing is created unless the
# environment supplies both values. No credential is ever committed here.
app.bootstrap.admin.email=${ADMIN_EMAIL:}
app.bootstrap.admin.password=${ADMIN_PASSWORD:}

springdoc.swagger-ui.path=/swagger-ui
management.endpoints.web.exposure.include=health
