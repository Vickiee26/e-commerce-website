# Production takes every secret from the environment. No defaults, by design:
# a missing or weak JWT_SECRET must stop the boot, not degrade it.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

app.jwt.secret=${JWT_SECRET}

spring.jpa.show-sql=false

# Never write a reset token to a production log.
app.email.log-tokens=false
